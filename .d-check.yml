# .d-check.yml — a-check prüft seine eigene Doku mit dem Schwester-Tool d-check
# (Dogfooding des Stacks). Erzeugt aus `d-check --suggest-config ai-harness-init`
# (v0.19.0) und auf a-check angepasst: AC-Kennungen statt DC-, kein slice-Muster
# (alle Slice-Erwähnungen sind Vorwärts-Referenzen). Baseline v3.5.2 (vendored, MR-006).
#
# Aktiv: links, anchors, ids (AC/ADR/MR-Linkpflicht), matrix (Spec-Straten
# verweisen nie abwärts — intra-Spec no-downward + ADR→Slice-Disziplin, MR-005),
# spans (offene Code-Spans) seit slice-029. `codepaths` bewusst NICHT aktiv:
# a-checks Domäne (Import-Auflösung) füllt die Doku mit illustrativen
# Beispiel-Specifiern (`./b`, `../core/model`, `./db` …), die codepaths nicht
# von echten Datei-Verweisen trennen kann — ~40 Falsch-Positive, Domänen-Misfit
# (slice-029 §Entscheidung). vcs/planning sind separate Targets (doc-immutable/
# doc-planning), nicht im Default.
scan:
  roots: ["."]
  # .harness/baseline/: committet vendored Baseline (MR-006) — externer,
  # unveraenderter Fremdtext mit eigenen Platzhaltern/Templates; nicht
  # a-checks Doku, darum nicht gegen a-checks Kennungs-/Linkregeln pruefen.
  ignore: [".harness/baseline/**"]

modules: [links, anchors, ids, matrix, spans, hostpaths, versions]

ids:
  patterns:
    - regex: 'ADR-\d{4}'
      target: docs/plan/adr/
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]
    - regex: 'MR-\d{3}'
      target: harness/conventions.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]
    - regex: 'AC-(FA-[A-Z]+|QA)-\d+'
      target: spec/lastenheft.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]
    - regex: 'SPEC-[A-Z]+-\d+'
      target: spec/spezifikation.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]
    - regex: 'ARC-\d{3}'
      target: spec/architecture.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]

matrix:
  classes:
    - name: spec-straten
      paths: [spec/lastenheft.md, spec/spezifikation.md, spec/architecture.md]
      # intra-Klassen-Richtung (MR-005): autoritativste Schicht zuerst; ein
      # Abwärtsverweis zwischen Spec-Straten (auch transitiv) ⇒ matrix-downward.
      order: [spec/lastenheft.md, spec/spezifikation.md, spec/architecture.md]
      direction: no-downward
    - { name: adr, paths: ["docs/plan/adr/[0-9]*.md"] }
    - name: slice
      paths: ["docs/plan/planning/**/slice-*.md"]
      # Token-Erkennung (MR-005): eine Slice-Kennung im ADR-Körper ⇒ matrix-forbidden,
      # außer per Provenance-Marker <!-- d-check:status-provenance --> deklariert.
      token: 'slice-\d{3}'
  rules:
    - { from: spec-straten, to: adr, allow: false }
    - { from: spec-straten, to: slice, allow: false }
    - { from: adr, to: slice, allow: false }
  status:
    forbidden: [superseded, deprecated]
  # Grandfathering (MR-005): die vor der Übernahme Accepted-ADRs (0001–0020) sind
  # immutabel und nennen Slices als Verifikations-Zeiger im Körper — ganz
  # übersprungen; neue ADRs ab 0021 sind slice-token-frei ODER tragen (bei Slice-Verweis) den Provenance-Marker.
  exempt-paths: ["docs/plan/adr/00[01][0-9]-*.md", "docs/plan/adr/0020-*.md"]
  exclude-sections: [Historie, "7. Historie", Geschichte]

# Modul vcs (DC-FA-VCS-001, slice-029): git-Diff-Immutabilität der eigenen
# Accepted-ADRs (AGENTS §3.5) über eine Commit-Range — `make doc-immutable`
# aktiviert es mit `--enable vcs` (NICHT in der modules-Liste, daher im
# hermetischen Default-doc-check inert). Die CI ruft es über die PR-/Push-Range
# (`.github/workflows/ci.yml`, neben `trace-check`) — so ist §3.5 maschinell
# durchgesetzt. Kern = ADR ohne Kopf-Status-Zeile und ohne `Geschichte`;
# head-allow lässt den Proposed→Accepted- und den Supersede-Übergang zu.

# Eine Versions-Angabe, die a-check ueber ein ANDERES eigenes Dokument macht,
# wird gegen dessen Kopf gehalten. Der Erwartungswert kommt versions-foermig aus
# dem `current-from`-Span; ein Digest kann das Modul nicht tragen (gemessen,
# slice-133: `keine Version im adressierten Span`, Exit 2) — die Digest-Gleichheit
# bleibt darum bei `tools/gate-consistency.sh`.
versions:
  patterns:
    - pin-pattern: 'Lastenheft steht bei \*\*(\d+\.\d+\.\d+)\*\*'
      current-from: spec/lastenheft.md#lastenheft--a-check

vcs:
  paths: ["docs/plan/adr/[0-9]*.md"]
  immutable-when: '^- \*\*Status:\*\* Accepted'
  exclude-sections: [Geschichte]
  status-line: '^- \*\*Status:\*\*'
  head-allow: '^- \*\*Status:\*\* (Accepted|Superseded by ADR-[0-9]{4})'

# Modul commits (DC-FA-COMMITS-001, slice-030, ADR-0021): Traceability-Kennung in
# Commit-Messages über eine Range bzw. Pending-Message — `make trace-check` aktiviert
# es mit `--enable commits` (NICHT in der modules-Liste, im Default-doc-check inert).
# Löst tools/trace-check.sh ab (AGENTS §5). id-patterns = die drei ids-Muster
# (AC/ADR/MR) plus slice-NNN; exempt-pattern nimmt Merge-/Revert-Betreffe aus.
commits:
  id-patterns:
    - 'AC-(FA-[A-Z]+|QA)-\d+'
    - 'ADR-\d{4}'
    - 'MR-\d{3}'
    - 'slice-\d+'
  exempt-pattern: '^(Merge |Revert )'

# Modul `targets` (DC-FA-TGT-001): Deklarations-Konsistenz Doku <-> Build-Targets.
# Ohne diesen Block laeuft `make doc-targets` wirkungslos — d-check aktiviert das
# Modul per --enable, findet keine Konfiguration und meldet 0 Befunde, Exit 0
# (slice-074). `makefiles` nennt BEIDE Fragmente: doc-tracked/doc-targets/doc-help
# stehen in d-check.mk, mit [Makefile] allein waeren sie drei Falsch-Positive.
# `exempt-targets` haelt dieselbe Utility-Menge wie UTILITY_TARGETS in
# tools/gate-consistency.sh — solange beide Pruefer laufen, muessen sie sich
# nicht widersprechen (die Abloesung entscheidet slice-073).
targets:
  makefiles: [Makefile, d-check.mk]
  # BEIDE Doku-Tabellen: der abgeloeste gate-consistency-Check (1) las AGENTS.md
  # UND harness/README.md. Ohne die zweite waere die Abloesung (slice-079) eine
  # Scope-Verkleinerung — gemessen: ein Phantom nur in harness/README.md blieb
  # unentdeckt.
  doc-tables: [AGENTS.md, harness/README.md]
  authority: AGENTS.md
  exempt-targets: [help, build, compile, hooks, arch-graph]

# Modul-Option `links.resolve-from` (slice-080): loest tools/verify-slice-links.sh
# ab (SL-002). Invariante: ein relativer Verweis einer WANDERNDEN Datei muss aus
# JEDEM Lifecycle-Verzeichnis aufloesen — sonst bricht ihn der naechste `git mv`.
# `done/` ist Endzustand und nur ZIEL (fixed-dirs), nie Quelle: ein kuenftiger
# Wechsel kann dortige Verweise nicht mehr brechen.
links:
  resolve-from:
    - dirs:
        - docs/plan/planning/open
        - docs/plan/planning/next
        - docs/plan/planning/in-progress
      fixed-dirs:
        - docs/plan/planning/done

# Modul `structure` (DC-FA-STRUCT-001, slice-080): loest die STRUKTURELLEN
# Haelften von verify-slice-form.sh und verify-closure-notes.sh ab. Erreichbar
# erst mit dem Pin `v0.68.0` — `tasks-ignore-pattern` und
# `exempt-section-pattern` entstanden aus a-checks CR 3 (d-check ADR-0075).
# `make doc-structure` aktiviert es per --enable; NICHT in der modules-Liste,
# im hermetischen Default-doc-check also inert.
structure:
  # (1) Groessen-Regel: hoechstens drei LIEFER-Punkte im DoD, ab slice-052.
  #     `tasks-ignore-pattern` nimmt die pro Slice KONSTANTEN Posten heraus —
  #     "gezaehlt wird nur, was mit dem Umfang waechst" (AGENTS §5).
  #     Das Muster ist VERANKERT und sieht den BEREINIGTEN Item-Text: der
  #     Gate-Lauf steht als `make gates` in Inline-Code, und der ist beim
  #     Zaehlen zu Leerzeichen bereinigt — ein Muster auf die Wendung selbst
  #     traefe null Items (d-check ADR-0075, hier nachgemessen).
  - files: "docs/plan/planning/**/slice-*.md"
    section-pattern: '^#+ .*(DoD|Definition of Done)'
    max-tasks: 3
    tasks-ignore-pattern: '^( *grün|Closure-Notiz|Beobachtungs-Register|Jedes Risiko|Reconciliation)'
    exempt-paths:
      - "docs/plan/planning/**/slice-0[0-4][0-9]-*.md"
      - "docs/plan/planning/**/slice-050-*.md"
      - "docs/plan/planning/**/slice-051-*.md"

  # (2) Closure-Struktur in done/: GENAU EINER, ausgefuellt, kein Platzhalter,
  #     mindestens zwei Saetze (AGENTS §5). `exempt-section-pattern` haelt
  #     "Closure-Trigger"/"Closure-Kriterien" heraus — eigene, legitime
  #     Abschnitte, keine Abschluss-Notiz. Vor slice-080 tat das ein `grep -v`.
  - files: "docs/plan/planning/done/slice-*.md"
    section-pattern: '^## .*[Cc]losure'
    exempt-section-pattern: '^## .*[Cc]losure-(Trigger|Kriterien)'
    sections: one
    non-empty: true
    min-sentences: 2
    forbid-pattern: '(beim Abschluss|_\(folgt\)_|TODO|TBD|noch offen|(?mi:^(fertig|erledigt|wie geplant umgesetzt|war ok|alles gut|läuft)\.?$))'
    hint: "genau eine ausgefuellte Closure-Notiz je Slice (AGENTS §5) — Platzhalter und Floskel zaehlen nicht"

  # (3) Lerneintrag-Form: die Closure-Notiz benennt EINE der drei Formen
  #     (AGENTS §5, Fund B-5). Ab slice-052 wie (1). Das Muster ist ENGER als in
  #     (2) — es verlangt die NUMMERIERTE Ueberschrift der Ziel-Form, die der
  #     Bestand ab slice-052 ausnahmslos einhaelt (63 von 63 gemessen). Zwei
  #     Regeln auf DERSELBEN Kennung (files + beide Muster) weist d-check als
  #     doppelte Regel-Identitaet ab; der Unterschied ist darum sachlich, nicht
  #     kosmetisch. GRENZE: ein kuenftiger Slice mit UNnummeriertem
  #     Closure-Abschnitt entginge dieser Regel — (2) faengt ihn nicht auf.
  - files: "docs/plan/planning/done/slice-*.md"
    section-pattern: '^## [0-9]+\. [Cc]losure'
    exempt-section-pattern: '^## .*[Cc]losure-(Trigger|Kriterien)'
    require-pattern: 'Form: *(geschärfte Regel|neuer Sensor|benannte Spec-Lücke)'
    hint: "Lerneintrag in einer der drei benannten Formen: geschaerfte Regel | neuer Sensor | benannte Spec-Luecke"
    exempt-paths:
      - "docs/plan/planning/done/slice-0[0-4][0-9]-*.md"
      - "docs/plan/planning/done/slice-050-*.md"
      - "docs/plan/planning/done/slice-051-*.md"

  # (4) Kopffelder ab slice-098: `—` ist eine gueltige Antwort, Schweigen nicht.
  #     Der "Abschnitt" ist der Kopf vom Titel bis zur ersten `##`-Ueberschrift.
  - files: "docs/plan/planning/**/slice-*.md"
    section-pattern: '^# slice-'
    require-all: ["Verantwortlich:", "Autor:", "Berührte Spec-Stellen:"]
    exempt-paths:
      - "docs/plan/planning/**/slice-0[0-8][0-9]-*.md"
      - "docs/plan/planning/**/slice-09[0-7]-*.md"

  # (5) AC-Form: jede NEUE Anforderung traegt Happy · Boundary · Negative ·
  #     Out-of-Scope (AGENTS §5). Loest tools/verify-ac-form.sh ab (slice-120).
  #
  #     `exempt-expect-count` ist der Schluessel, an dem diese Abloesung haengt
  #     (d-check ADR-0078, aus a-checks CR 4). Ohne ihn meldete die Regel heute
  #     `section-missing`: das Lastenheft traegt genau 19 `### AC-`-Ueberschriften,
  #     und alle 19 sind grandfathered — die geprueste Menge waere leer, und die
  #     Nullmengen-Haerte wirft Konfigurationsdefekt und Bestandszustand in einen
  #     Grund-Code. Die ZAHL trennt beides: stimmt sie, ist die leere Menge der
  #     deklarierte Zustand; weicht sie ab, meldet `section-exempt-mismatch`.
  #
  #     MARKEN-FORM, gemessen statt vom abgeloesten Sensor uebernommen. Die Marken
  #     tragen den Doppelpunkt und treffen damit die Form, die ALLE 19 bestehenden
  #     nutzen (`- **Happy:** Given …`, 17 Fundstellen). verify-ac-form suchte
  #     stattdessen `^**Happy Path:**` — Zeilenanfang OHNE Listen-Marker und mit
  #     einem Wort, das im Repo NULL mal vorkommt und das die kanonische Quelle
  #     (harness/conventions.md §Anforderungs-Anlege-Prozess: "Happy/Boundary/
  #     Negative") nicht kennt. Er haette jede neue AC in Bestandsform beanstandet;
  #     gemerkt hat es niemand, weil seine Pruefmenge leer war (slice-120).
  #
  #     Die 19 stehen damit an ZWEI Orten — in der Aufzählung und als Zahl. Das
  #     ist Absicht und die eigentliche Zusage: die Aufzählung kann veralten, und
  #     die Zahl macht das laut statt stumm. Sie wird von Hand nachgezogen; die
  #     Grandfather-Liste waechst laut AGENTS §5 nicht mit.
  - files: "spec/lastenheft.md"
    section-pattern: '^### AC-'
    sections: each
    require-all: ["Happy:", "Boundary:", "Negative:", "Out-of-Scope:"]
    exempt-section-pattern: '^### (AC-FA-RULE-0(0[1-9]|1[01])|AC-FA-EXTRACT-001|AC-FA-CLI-00[12]|AC-FA-CONF-001|AC-FA-DIST-001|AC-QA-0[123])\b'
    exempt-expect-count: 19
    hint: "neue AC braucht Happy, Boundary, Negative und Out-of-Scope (AGENTS §5); die 19 bei Einfuehrung bestehenden sind grandfathered"

# Modul `planning` (DC-FA-PLAN-001): Lifecycle-Konsistenz Roadmap <-> in-progress/.
# Ohne diesen Block lief `make doc-planning` WIRKUNGSLOS — d-check aktiviert das
# Modul per --enable, findet keine Konfiguration und meldet 0 Befunde, Exit 0
# (BEO-014, 2x; dieselbe Klasse wie die targets-Luecke aus slice-074).
#
# KEIN Default trifft hier: a-checks Roadmap fuehrt die Sektion `## Offene Wellen`
# (Default `## Aktuelle Welle`) und den Ruhe-Marker `Nichts in Arbeit.` (Default
# `Keine aktive Welle`). GEMESSEN: mit den Defaults meldet das Modul nicht etwa
# Unsinn, sondern FAIL-CLOSED — "kanonische Ueberschrift fehlt, Aktiv-Status nicht
# bestimmbar". Die Luecke war also nicht eine falsche Konfiguration, sondern GAR
# keine: fail-closed schuetzt erst ab der ersten Zeile.
#
# `closure:` und `waves:` bleiben BEWUSST unkonfiguriert (slice-122): die
# Closure-Struktur prueft seit slice-080 das Modul `structure`, und zwei Pruefer
# auf dieselbe Zusage laufen auseinander. Ein Wellen-Register fuehrt a-check nicht.
planning:
  roadmap: docs/plan/planning/in-progress/roadmap.md
  heading: "## Offene Wellen"
  marker: "Nichts in Arbeit."
  #
  # BENANNTE GRENZE (gemessen, slice-122): geprueft wird die AEQUIVALENZ
  # "Slice(s) vorhanden <-> Ruhe-Marker steht nicht", NICHT ob jeder einzelne
  # Slice in der Sektion genannt ist. Zwei Slices in in-progress/ bei einer
  # Sektion, die nur einen nennt, bleiben gruen — und das WIP-Limit (AGENTS §5)
  # faengt das Modul ebenfalls nicht.

# Modul `workflows` (slice-130): Deklarations-Form der `uses:`-Referenzen unter
# `.github/workflows`. `dir:` ist der Aktivierungs-Schalter — ohne ihn ist das
# Modul inert und meldete 0 Befunde bei Exit 0, dieselbe Klasse wie die
# targets-Luecke (slice-074) und die planning-Luecke (BEO-014).
#
# GEPRUEFT WIRD DIE FORM, NICHT DIE GUELTIGKEIT: eine fremde Referenz nennt
# einen vollen 40-stelligen SHA (uses-pin-missing) mit Tag-Kommentar dahinter
# (uses-pin-untagged). Ob der Kommentar zum SHA PASST, sagt das Modul nicht —
# das waere Netz, und d-check ist hermetisch. Der Widerspruch, der diesen Slice
# ausgeloest hat (ein Digest, zwei Tag-Kommentare), bleibt damit ungedeckt und
# steht als BEO-026 weiter offen.
#
# Die lokale Referenz (`./…`) braucht keinen Pin — sie loest auf denselben
# Commit auf wie ihr Aufrufer —, dafuer zwei andere Zusagen: das Ziel existiert
# (uses-local-missing), und der aufrufende JOB fuehrt die Rechte, die es
# verlangt (uses-local-perms-undeclared/-narrow). Der erste Lauf fand hier den
# latenten Bruch in release.yml, der die Hub-Darstellung bei v0.18.0 zur
# Handarbeit machte (slice-130 §4).
workflows:
  dir: .github/workflows
