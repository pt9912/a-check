name: image-scan

# CVE-Scan gegen das PUBLIZIERTE Image (ADR-0037).
#
# Warum zeitgesteuert: alle uebrigen Gates dieses Repos haengen an einem
# Commit. Gegen CVEs ist das prinzipiell blind — sie tauchen auf, ohne dass
# sich das Repo aendert, und zwischen zwei Releases altert das publizierte
# Image weiter.
#
# `workflow_dispatch` ist Pflicht, nicht Komfort: ein Workflow, der nur an
# einem seltenen Ereignis haengt, wird erst im Ernstfall auf die Probe
# gestellt.
#
# BETRIEBS-GRENZE: die Abtastrate von `schedule` ist unzuverlaessig — ein
# "nightly" ist eine Abtastung, keine Zusage. GitHub schaltet `schedule` in
# inaktiven Repos zudem nach 60 Tagen ab, und ein still abgeschalteter
# Nachtlauf sieht aus wie ein gruener (ADR-0037 §Konsequenzen).

on:
  schedule:
    # 03:17 UTC — abseits der vollen Stunde, wo die Runner-Nachfrage am
    # hoechsten ist.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Trivy gegen das publizierte Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Kein `continue-on-error`: der Schritt endet immer mit 0 und meldet
      # seinen Ausgang ueber `status`.
      #
      # DER AUSGANG WIRD AUS DEM LOG GELESEN, NICHT AUS DEM EXIT-CODE — und das
      # ist keine Bequemlichkeit: GNU Make normalisiert JEDEN fehlgeschlagenen
      # Recipe auf seinen eigenen Exit 2. `make image-scan` liefert deshalb nur
      # 0 oder 2; die Drei-Code-Semantik des Skripts (0 sauber / 1 behebbare
      # Befunde / 2 Scan gescheitert) ueberlebt die make-Grenze nicht. Wer hier
      # `rc` auswertet, meldet gemessene Befunde als "Scan gescheitert".
      # GEMESSEN beim ersten Lauf: Skript 1, `make` 2.
      - name: make image-scan
        id: scan
        run: |
          set -o pipefail
          mkdir -p .tmp/security
          rc=0
          make image-scan 2>&1 | tee .tmp/security/image-scan.log || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if grep -q 'GESCHEITERT' .tmp/security/image-scan.log; then
            echo "status=error" >> "$GITHUB_OUTPUT"
          elif grep -q 'behebbare CRITICAL/HIGH-Befunde' .tmp/security/image-scan.log; then
            echo "status=findings" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            # Nicht-null ohne Skript-Marker: der Lauf ist gar nicht bis zur
            # Auswertung gekommen (Docker fehlt, make bricht vorher ab).
            echo "status=error" >> "$GITHUB_OUTPUT"
          else
            echo "status=clean" >> "$GITHUB_OUTPUT"
          fi

      - name: Bericht ins Job-Summary
        if: always()
        env:
          STATUS: ${{ steps.scan.outputs.status }}
        run: |
          set -euo pipefail
          {
            echo "### CVE-Scan des publizierten Image"
            echo ""
            case "$STATUS" in
              clean)    echo "**Sauber** — keine behebbaren CRITICAL/HIGH." ;;
              findings) echo "**Handlungspflichtig** — behebbare CRITICAL/HIGH gefunden." ;;
              *)        echo "**Scan gescheitert** — der Befundstand ist UNBEKANNT, nicht gruen." ;;
            esac
            echo ""
            echo '```'
            tail -c 60000 .tmp/security/image-scan.log 2>/dev/null || echo "(kein Log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ausgang durchreichen
        env:
          STATUS: ${{ steps.scan.outputs.status }}
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          set -euo pipefail
          if [ "$STATUS" = "clean" ]; then
            echo "image-scan: sauber."
            exit 0
          fi
          if [ "$STATUS" = "findings" ]; then
            echo "::error title=CVE-Scan::Behebbare CRITICAL/HIGH im publizierten Image — siehe Job-Summary."
          else
            echo "::error title=CVE-Scan::Scan GESCHEITERT (Exit ${RC}) — der Befundstand ist UNBEKANNT, nicht gruen."
          fi
          exit 1
