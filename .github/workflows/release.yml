name: release

# GHCR-Release-Pipeline (slice-007; AC-FA-DIST-001, AC-QA-03, ADR-0007;
# Stack-Vorbild d-check release.yml).
#
# Trigger: Push von Tags `v*`. Der Validate-Step verwirft alles, was nicht
# `vMAJOR.MINOR.PATCH(-prerelease)?` ist, BEVOR eingeloggt, gebaut oder
# gepusht wird. `:latest` wird ausschließlich für stabile Tags gesetzt
# (ADR-0007); Konsumenten werden auf Digest-Pins verwiesen (docs/user/releasing.md).
#
# Docker-only-Pfad (AGENTS.md §3.1): `make ci` fährt die kompletten Gates inkl.
# Image-Integrationstests und baut dabei das lokale Runtime-Image
# (`a-check:dev`), das anschließend für GHCR umgetaggt und gepusht wird.
#
# Action-Pinning (Supply-Chain-Härtung, Stack-Konvention): alle `uses:`-Einträge
# sind SHA-gepinnt mit Tag-Kommentar.

on:
  push:
    tags:
      - 'v*'

# Top-level: alles entziehen; der Job lockert nur, was er braucht.
permissions: {}

jobs:
  release:
    name: release (ghcr.io image push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Fuer den Folge-Job hub-description: dieselbe Version, die den
      # Spiegel und das GitHub-Release traegt — keine zweite Ableitung.
      version: ${{ steps.tag.outputs.version }}
    permissions:
      contents: write    # GitHub-Release mit Digest-Pin anlegen
      packages: write
    env:
      DOCKER_BUILDKIT: '1'
      REGISTRY: ghcr.io
      IMAGE_NAME: pt9912/a-check
      # LOCAL_IMAGE muss zum Makefile-Default `IMAGE ?= a-check` passen —
      # `make ci`/`make build` taggt `$(IMAGE):dev` lokal.
      LOCAL_IMAGE: a-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SemVer-Validate ZUERST (fail-fast vor Login/Build/Push): strikte
      # SemVer-2.0-Prüfung, Build-Metadaten (`+`) abgelehnt ('+' ist kein
      # gültiges OCI-Tag-Zeichen).
      - name: Validate SemVer tag
        id: tag
        run: |
          set -euo pipefail
          TAG_REF="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::Tag '$TAG_REF' ist kein gültiger Release-Tag (erwartet vMAJOR.MINOR.PATCH oder -PRERELEASE; Build-Metadaten mit '+' abgelehnt)."
            exit 1
          fi
          VERSION="${TAG_REF#v}"
          if [[ "$VERSION" == *-* ]]; then IS_STABLE="false"; else IS_STABLE="true"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_stable=$IS_STABLE" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION, is_stable=$IS_STABLE"

      # Volle Gates + Image-Integrationstests (AC-FA-DIST-001-AKs); baut zugleich
      # das Runtime-Image mit der Tag-Version (VERSION -> OCI-Label).
      - name: Gates + Image-Integrationstests (make ci)
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: make ci VERSION="$VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE:dev" "$REGISTRY/$IMAGE_NAME:v$VERSION"
          if [[ "$IS_STABLE" == "true" ]]; then
            docker tag "$LOCAL_IMAGE:dev" "$REGISTRY/$IMAGE_NAME:latest"
          fi

      # OCI-Label-Pin: die Dockerfile-Labels müssen gesetzt sein, und
      # org.opencontainers.image.version muss exakt der Tag-Version entsprechen
      # — ein Build mit Version-Drift darf nicht shippen (ADR-0007).
      - name: Verify OCI labels
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          REF="$REGISTRY/$IMAGE_NAME:v$VERSION"
          for LABEL in \
            org.opencontainers.image.source \
            org.opencontainers.image.description \
            org.opencontainers.image.licenses \
            org.opencontainers.image.title \
            org.opencontainers.image.vendor
          do
            VALUE=$(docker image inspect --format "{{ index .Config.Labels \"$LABEL\" }}" "$REF")
            if [[ -z "$VALUE" ]]; then
              echo "::error::OCI-Label $LABEL ist leer auf $REF."
              exit 1
            fi
            echo "$LABEL=$VALUE"
          done
          IMAGE_VERSION=$(docker image inspect --format \
            '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$REF")
          if [[ "$IMAGE_VERSION" != "$VERSION" ]]; then
            echo "::error::org.opencontainers.image.version=[$IMAGE_VERSION] entspricht nicht der Tag-Version [$VERSION]."
            exit 1
          fi
          echo "org.opencontainers.image.version=$IMAGE_VERSION (matcht Tag)"

      - name: Push to GHCR
        id: push
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
        run: |
          set -euo pipefail
          docker push "$REGISTRY/$IMAGE_NAME:v$VERSION"
          if [[ "$IS_STABLE" == "true" ]]; then
            docker push "$REGISTRY/$IMAGE_NAME:latest"
          fi
          DIGEST=$(docker inspect --format '{{ index .RepoDigests 0 }}' "$REGISTRY/$IMAGE_NAME:v$VERSION")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### a-check v$VERSION"
            echo ""
            echo "Digest-Pin für Konsumenten:"
            echo ""
            echo '```'
            echo "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Docker-Hub-Spiegel (AC-FA-DIST-002, ADR-0039). Zusage ist DASSELBE Bild,
      # nicht ein zweiter Bau. Er steht NACH dem GHCR-Push, damit die Quelle nie
      # hinter dem Spiegel zurueckliegt.
      #
      # GLEICHHEITS-GROESSE IST DER CONFIG-DIGEST, nicht der Manifest-Digest:
      # letzterer ist registry-lokal (Blob-Kompression) und waere auf beiden
      # Seiten verschieden, auch bei identischem Inhalt.
      #
      # FAIL-CLOSED: der Spiegel ist eine Zusage. Die Fehlermeldung nennt den
      # bereits veroeffentlichten GHCR-Digest — der Teilstand ist gueltig, und
      # wer aufraeumt, muss wissen, was schon draussen ist.
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror to Docker Hub
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
          GHCR_DIGEST: ${{ steps.push.outputs.digest }}
          HUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'pt9912/a-check' }}
        run: |
          set -euo pipefail
          trap 'echo "::error::Docker-Hub-Spiegel fehlgeschlagen. BEREITS VEROEFFENTLICHT: ${GHCR_DIGEST} auf ghcr.io — das Release ist unvollstaendig, der GHCR-Stand aber gueltig."' ERR

          SRC="$REGISTRY/$IMAGE_NAME:v$VERSION"
          docker tag "$SRC" "$HUB_IMAGE:v$VERSION"
          docker push "$HUB_IMAGE:v$VERSION"
          if [[ "$IS_STABLE" == "true" ]]; then
            docker tag "$SRC" "$HUB_IMAGE:latest"
            docker push "$HUB_IMAGE:latest"
          fi

          # Der Config-Digest steht im Manifest; er beschreibt den INHALT und
          # ist damit die Groesse, die auf beiden Registries gleich sein muss.
          # GEMESSEN, nicht uebernommen: `docker manifest inspect` gibt
          # MEHRZEILIGES, eingeruecktes JSON aus. Ein einzeiliges sed-Muster
          # greift darauf NICHT -- es lieferte leer, und ein Vergleich zweier
          # leerer Werte meldet faelschlich Gleichheit. Der Riegel unten faengt
          # das (fail-closed), aber der Spiegel waere blockiert statt geprueft.
          # Darum erst Whitespace entfernen, dann matchen (slice-127).
          config_digest() {
            docker manifest inspect "$1" \
              | tr -d ' \n\t' \
              | sed -n 's/.*"config":{[^}]*"digest":"\(sha256:[0-9a-f]\{64\}\)".*/\1/p' \
              | head -1
          }
          C_GHCR="$(config_digest "$SRC")"
          C_HUB="$(config_digest "$HUB_IMAGE:v$VERSION")"
          [ -n "$C_GHCR" ] && [ -n "$C_HUB" ] || {
            echo "::error::Config-Digest nicht ermittelbar (ghcr='$C_GHCR', hub='$C_HUB')."
            exit 1
          }
          if [ "$C_GHCR" != "$C_HUB" ]; then
            echo "::error::Spiegel-Ungleichheit: config ghcr=$C_GHCR, hub=$C_HUB — es sind nicht dieselben Bilder."
            exit 1
          fi
          echo "Spiegel geprueft: Config-Digest identisch ($C_GHCR)."
          {
            echo ""
            echo "Docker-Hub-Spiegel: \`$HUB_IMAGE:v$VERSION\` — Config-Digest identisch."
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub-Release mit dem Digest-Pin in den Notes — der Pin ist die
      # Referenz, die Konsumenten-Repos in a-check.mk eintragen.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PRERELEASE_FLAG=""
          if [[ "$IS_STABLE" != "true" ]]; then PRERELEASE_FLAG="--prerelease"; fi
          if gh release view "$TAG" --json tagName --jq '.tagName' >/dev/null 2>&1; then
            echo "GitHub-Release $TAG existiert bereits — wird wiederverwendet."
          else
            gh release create "$TAG" \
              --title "a-check $TAG" \
              --notes "Siehe [CHANGELOG.md §[$VERSION]](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md). Digest-Pin: \`$DIGEST\`" \
              --target "$GITHUB_SHA" \
              $PRERELEASE_FLAG
          fi

  # Die Hub-DARSTELLUNG, getrennt vom Spiegel und ausdruecklich NICHT
  # fail-closed (ADR-0039): das Bild ist die Zusage, der Beschreibungstext ist
  # Praesentation. Der Job laeuft NACH dem Release-Job und nur, wenn dieser
  # durch ist — eine Seite zu setzen, die auf ein nicht veroeffentlichtes Bild
  # zeigt, waere eine Falschaussage.
  hub-description:
    name: Hub-Darstellung
    needs: release
    # Ein aufgerufener Workflow bekommt nur, was der aufrufende JOB fuehrt: der
    # Kopf oben ist `permissions: {}`, und was der Job nicht deklariert, kann er
    # nicht weitergeben. Ohne diese zwei Zeilen bricht GitHub den Lauf VOR dem
    # ersten Job ab — ohne Log und ohne Hinweis auf die Zeile. Genau darum musste
    # die Hub-Darstellung bei v0.18.0 von Hand gestartet werden (slice-130).
    permissions:
      contents: read     # das Ziel liest das Repo fuer den Beschreibungstext
    uses: ./.github/workflows/hub-description.yml
    with:
      version: v${{ needs.release.outputs.version }}
    secrets: inherit
