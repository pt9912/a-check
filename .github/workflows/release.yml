name: release

# GHCR-Release-Pipeline (AC-FA-DIST-001, AC-FA-DIST-002, AC-QA-03, ADR-0007,
# ADR-0043; Stack-Vorbild d-check release.yml).
#
# Trigger: Push von Tags `v*`. Der Validate-Step verwirft alles, was nicht
# `vMAJOR.MINOR.PATCH(-prerelease)?` ist, BEVOR eingeloggt, gebaut oder
# gepusht wird. `:latest` wird ausschließlich für stabile Tags gesetzt
# (ADR-0007); Konsumenten werden auf Digest-Pins verwiesen (docs/user/releasing.md).
#
# EIN BAU, GETESTET, DANN GETAGGT (ADR-0043, SPEC-DIST-001):
#   build      — `make ci` (Gates, einplattformig), dann `make image-multiarch`:
#                ein Bau für linux/amd64 + linux/arm64, geprüft als Archiv und
#                OHNE Tag nach GHCR hochgeladen (nur per Digest).
#   test-amd64 / test-arm64 — je ein nativer Runner zieht DIESEN Digest und fährt
#                `make image-test` samt Versions-Label; jeder gibt einen SHA-256
#                über Exit-Code, stdout und stderr seines Scans aus.
#   publish    — verlangt beide Hashes gleich, setzt erst dann den Bild-Tag auf
#                denselben Digest, kopiert den Index nach Docker Hub, prüft dort
#                denselben Index-Digest und legt das GitHub-Release an.
# Ein roter Job vor `publish` lässt den Index ohne Bild-Tag in GHCR zurück.
#
# Docker-only-Pfad (AGENTS.md §3.1): jeder Schritt läuft über `make` oder die
# Docker-CLI.
#
# Action-Pinning (Supply-Chain-Härtung, Stack-Konvention): alle `uses:`-Einträge
# sind SHA-gepinnt mit Tag-Kommentar.

on:
  push:
    tags:
      - 'v*'

# Top-level: alles entziehen; jeder Job lockert nur, was er braucht.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pt9912/a-check

jobs:
  build:
    name: build (ein Bau, beide Plattformen, Upload ohne Tag)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.tag.outputs.version }}
      is_stable: ${{ steps.tag.outputs.is_stable }}
      digest: ${{ steps.bau.outputs.digest }}
    permissions:
      contents: read
      packages: write   # Upload ohne Tag
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SemVer-Validate ZUERST (fail-fast vor Login/Build/Push): strikte
      # SemVer-2.0-Prüfung, Build-Metadaten (`+`) abgelehnt ('+' ist kein
      # gültiges OCI-Tag-Zeichen).
      - name: Validate SemVer tag
        id: tag
        run: |
          set -euo pipefail
          TAG_REF="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::Tag '$TAG_REF' ist kein gültiger Release-Tag (erwartet vMAJOR.MINOR.PATCH oder -PRERELEASE; Build-Metadaten mit '+' abgelehnt)."
            exit 1
          fi
          VERSION="${TAG_REF#v}"
          if [[ "$VERSION" == *-* ]]; then IS_STABLE="false"; else IS_STABLE="true"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_stable=$IS_STABLE" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION, is_stable=$IS_STABLE"

      # Volle Gates + Image-Integrationstests auf dem einplattformigen Bau — die
      # Code-Fragen. Das veröffentlichte Bild entsteht im nächsten Schritt.
      - name: Gates + Image-Integrationstests (make ci)
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: make ci VERSION="$VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ein Bau, zwei Ausgaben: das geprüfte Archiv und der Upload ohne Tag.
      # Das Target bricht ab, wenn beide nicht denselben Index-Digest tragen.
      - name: Bau beider Plattformen, Prüfung, Upload ohne Tag (make image-multiarch)
        id: bau
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          make image-multiarch VERSION="$VERSION" PUSH_NAME="$REGISTRY/$IMAGE_NAME"
          DIGEST="$(cat .build/a-check-multiarch.oci.tar.digest)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::kein Index-Digest ermittelt: '$DIGEST'"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Index ohne Tag: $REGISTRY/$IMAGE_NAME@$DIGEST"

  # Zwei Jobs statt einer Matrix: jeder gibt seinen Scan-Hash unter EIGENEM Namen
  # aus, und `publish` liest beide. Gleich bis auf `runs-on`.
  test-amd64:
    name: test (linux/amd64, nativ)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scan: ${{ steps.test.outputs.scan }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Test gegen den Digest (make image-test IMAGE_REF=…)
        id: test
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          make image-test IMAGE_REF="$REGISTRY/$IMAGE_NAME@$DIGEST" VERSION="$VERSION" SCAN_OUT_DIR=scanout
          cat scanout/scan.exit scanout/scan.stdout scanout/scan.stderr
          SCAN="$(cat scanout/scan.exit scanout/scan.stdout scanout/scan.stderr | sha256sum | cut -c1-64)"
          echo "scan=$SCAN" >> "$GITHUB_OUTPUT"
          echo "Scan-Hash linux/amd64: $SCAN"

  test-arm64:
    name: test (linux/arm64, nativ)
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      scan: ${{ steps.test.outputs.scan }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Test gegen den Digest (make image-test IMAGE_REF=…)
        id: test
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          make image-test IMAGE_REF="$REGISTRY/$IMAGE_NAME@$DIGEST" VERSION="$VERSION" SCAN_OUT_DIR=scanout
          cat scanout/scan.exit scanout/scan.stdout scanout/scan.stderr
          SCAN="$(cat scanout/scan.exit scanout/scan.stdout scanout/scan.stderr | sha256sum | cut -c1-64)"
          echo "scan=$SCAN" >> "$GITHUB_OUTPUT"
          echo "Scan-Hash linux/arm64: $SCAN"

  publish:
    name: publish (Bild-Tag, Spiegel, GitHub-Release)
    needs: [build, test-amd64, test-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write    # GitHub-Release mit Digest-Pin anlegen
      packages: write    # Bild-Tag auf GHCR
    env:
      VERSION: ${{ needs.build.outputs.version }}
      IS_STABLE: ${{ needs.build.outputs.is_stable }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      # Gleiche Ausgabe auf beiden Plattformen (AC-FA-DIST-001 Boundary) — vor
      # jedem Tag. Ein leerer Hash ist ein Befund, keine Gleichheit.
      - name: Scan-Ausgabe beider Plattformen vergleichen
        env:
          SCAN_AMD64: ${{ needs.test-amd64.outputs.scan }}
          SCAN_ARM64: ${{ needs.test-arm64.outputs.scan }}
        run: |
          set -euo pipefail
          [ -n "$SCAN_AMD64" ] && [ -n "$SCAN_ARM64" ] || { echo "::error::Scan-Hash fehlt (amd64='$SCAN_AMD64', arm64='$SCAN_ARM64')"; exit 1; }
          if [ "$SCAN_AMD64" != "$SCAN_ARM64" ]; then
            echo "::error::Scan-Ausgabe weicht ab: amd64=$SCAN_AMD64, arm64=$SCAN_ARM64 — kein Bild-Tag."
            exit 1
          fi
          echo "Scan-Ausgabe auf beiden Plattformen gleich ($SCAN_AMD64)."

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bild-Tag auf DENSELBEN Digest — kein zweiter Bau. Danach wird
      # nachgelesen, dass der Tag wirklich auf diesen Digest zeigt.
      - name: Bild-Tag setzen
        run: |
          set -euo pipefail
          SRC="$REGISTRY/$IMAGE_NAME@$DIGEST"
          TAGS=(-t "$REGISTRY/$IMAGE_NAME:v$VERSION")
          if [[ "$IS_STABLE" == "true" ]]; then TAGS+=(-t "$REGISTRY/$IMAGE_NAME:latest"); fi
          docker buildx imagetools create "${TAGS[@]}" "$SRC"
          GOT="$(docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:v$VERSION" --format '{{.Manifest.Digest}}')"
          [ "$GOT" = "$DIGEST" ] || { echo "::error::v$VERSION zeigt auf $GOT, getestet war $DIGEST."; exit 1; }
          {
            echo "### a-check v$VERSION"
            echo ""
            echo "Digest-Pin für Konsumenten (Image-Index, linux/amd64 + linux/arm64):"
            echo ""
            echo '```'
            echo "$REGISTRY/$IMAGE_NAME@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Docker-Hub-Spiegel (AC-FA-DIST-002, ADR-0043 Punkt 7): der Index wird
      # UNVERÄNDERT kopiert, nicht neu hochgeladen — ein Neu-Push aus dem lokalen
      # Bildspeicher schriebe nur die Host-Plattform. Gleichheit = derselbe
      # Index-Digest. FAIL-CLOSED: die Meldung nennt den bereits veröffentlichten
      # GHCR-Digest.
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror to Docker Hub
        env:
          HUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'pt9912/a-check' }}
        run: |
          set -euo pipefail
          trap 'echo "::error::Docker-Hub-Spiegel fehlgeschlagen. BEREITS VEROEFFENTLICHT: $REGISTRY/$IMAGE_NAME@$DIGEST — das Release ist unvollstaendig, der GHCR-Stand aber gueltig."' ERR
          SRC="$REGISTRY/$IMAGE_NAME@$DIGEST"
          TAGS=(-t "docker.io/$HUB_IMAGE:v$VERSION")
          if [[ "$IS_STABLE" == "true" ]]; then TAGS+=(-t "docker.io/$HUB_IMAGE:latest"); fi
          docker buildx imagetools create "${TAGS[@]}" "$SRC"
          HUB="$(docker buildx imagetools inspect "docker.io/$HUB_IMAGE:v$VERSION" --format '{{.Manifest.Digest}}')"
          if [ "$HUB" != "$DIGEST" ]; then
            echo "::error::Spiegel-Ungleichheit: Index-Digest ghcr=$DIGEST, hub=$HUB — es ist nicht derselbe Index."
            exit 1
          fi
          docker buildx imagetools inspect "docker.io/$HUB_IMAGE:v$VERSION"
          echo "Spiegel geprueft: Index-Digest identisch ($DIGEST)."
          {
            echo ""
            echo "Docker-Hub-Spiegel: \`$HUB_IMAGE:v$VERSION\` — derselbe Index-Digest."
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub-Release mit dem Digest-Pin in den Notes — der Pin ist die
      # Referenz, die Konsumenten-Repos in a-check.mk eintragen.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PRERELEASE_FLAG=""
          if [[ "$IS_STABLE" != "true" ]]; then PRERELEASE_FLAG="--prerelease"; fi
          if gh release view "$TAG" --json tagName --jq '.tagName' >/dev/null 2>&1; then
            echo "GitHub-Release $TAG existiert bereits — wird wiederverwendet."
          else
            gh release create "$TAG" \
              --title "a-check $TAG" \
              --notes "Siehe [CHANGELOG.md §[$VERSION]](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md). Digest-Pin (linux/amd64 + linux/arm64): \`$REGISTRY/$IMAGE_NAME@$DIGEST\`" \
              --target "$GITHUB_SHA" \
              $PRERELEASE_FLAG
          fi

  # Die Hub-DARSTELLUNG, getrennt vom Spiegel und ausdruecklich NICHT
  # fail-closed (ADR-0039): das Bild ist die Zusage, der Beschreibungstext ist
  # Praesentation. Der Job laeuft NACH `publish` und nur, wenn dieser durch ist —
  # eine Seite zu setzen, die auf ein nicht veroeffentlichtes Bild zeigt, waere
  # eine Falschaussage.
  hub-description:
    name: Hub-Darstellung
    needs: [build, publish]
    # Ein aufgerufener Workflow bekommt nur, was der aufrufende JOB fuehrt: der
    # Kopf oben ist `permissions: {}`, und was der Job nicht deklariert, kann er
    # nicht weitergeben. Ohne diese zwei Zeilen bricht GitHub den Lauf VOR dem
    # ersten Job ab — ohne Log und ohne Hinweis auf die Zeile.
    permissions:
      contents: read     # das Ziel liest das Repo fuer den Beschreibungstext
    uses: ./.github/workflows/hub-description.yml
    with:
      version: v${{ needs.build.outputs.version }}
    secrets: inherit
